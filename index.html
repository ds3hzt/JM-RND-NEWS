<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12365a"><title>JM R&D 최신 동향</title><style>:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#182d43;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#103456,#196184);color:white;padding:26px 18px}header>div,main{max-width:850px;margin:auto}h1{margin:0;font-size:28px}header p{margin:8px 0;color:#e0f0f8}main{padding:14px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}.tabs button{font-size:19px;font-weight:750;padding:15px 8px;border:1px solid #c8d5e1;background:white;border-radius:12px;color:#28465f}.tabs button.active{background:#123f66;color:white}.panel,.article{background:white;border-radius:15px;padding:17px;margin:12px 0;box-shadow:0 3px 14px #15345110}input{width:100%;font-size:18px;padding:13px;border:1px solid #c8d5e1;border-radius:11px}.chips{display:flex;gap:7px;overflow:auto;padding:12px 0}.chips button{white-space:nowrap;border:1px solid #cbd9e5;border-radius:25px;background:white;padding:10px 12px;font-size:15px}.chips button.active{background:#123f66;color:white}.muted{color:#62758a;font-size:14px}.article h2{font-size:20px;line-height:1.45;margin:9px 0}.tag{display:inline-block;background:#eaf3f9;color:#235a80;padding:5px 9px;border-radius:8px;margin:3px;font-size:13px}details{margin-top:12px;border-top:1px solid #e4edf4;padding-top:12px}summary{font-size:16px;font-weight:700;cursor:pointer;color:#135a86}p{line-height:1.7}a{color:#0764a5}footer{text-align:center;color:#687d90;padding:30px 12px}.archive-row{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;padding:16px 10px;border-bottom:1px solid #dbe5ee;align-items:start}.archive-date{font-size:16px;font-weight:800;color:#123f66;line-height:1.5}.archive-date small{display:block;font-size:12px;font-weight:500;color:#718093}.archive-titles{margin:0;padding-left:21px}.archive-titles li{margin:0 0 10px;line-height:1.5;font-size:16px}.archive-titles button{border:0;background:none;text-align:left;padding:0;color:#1b354b;font:inherit;cursor:pointer}.archive-titles button:hover{text-decoration:underline;color:#0764a5}.archive-titles button:focus-visible{outline:2px solid #0764a5}.archive-expanded{grid-column:1/-1;background:#f5f9fc;padding:8px;border-radius:10px}.archive-list{background:white;border-radius:15px;box-shadow:0 3px 14px #15345110;overflow:hidden}.day{width:100%;text-align:left;border:1px solid #d7e2ec;background:#fff;border-radius:12px;padding:14px;margin:7px 0;font-size:16px;color:#19344a}.day.active{border:2px solid #125d89;background:#eff7fc}.day strong{display:block;font-size:19px;margin-bottom:7px}.heading{font-size:21px;margin:4px 0 10px}#status{min-height:18px}.sharebar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:12px}.sharebtn{background:#fee500;color:#211b00;border:1px solid #e7cf00;border-radius:11px;padding:12px 16px;font-size:17px;font-weight:750;cursor:pointer}.sharehint{font-size:13px;color:#62758a}.sharefeedback{font-size:14px;color:#235a80;margin-top:8px}</style></head><body><header><div><h1>JM R&D 최신 동향</h1><p>도금 · 표면처리 · 전자부품 · 산업기술</p><p style="font-size:14px">매일 오전 7시 업데이트 목표 · 한국 및 해외 기술 동향</p></div></header><main><nav class="tabs" aria-label="뉴스 메뉴"><button id="todayTab" class="active" type="button">오늘의 동향</button><button id="archiveTab" type="button">과거 동향</button></nav><section id="todayView"><div class="panel"><h2 class="heading" id="todayHeading">오늘의 동향</h2><p class="muted" id="todayStatus">뉴스를 불러오는 중입니다.</p><div class="sharebar"><button class="sharebtn" id="shareNews" type="button">카카오톡으로 공유 ↗</button><span class="sharehint">카카오톡 대화방 선택 · 모바일에서 안 열리면 기본 브라우저 이용</span></div><div id="shareFeedback" class="sharefeedback" role="status" aria-live="polite"></div></div><div id="todayArticles"></div></section><section id="archiveView" hidden><div class="panel"><label for="search"><strong>과거 동향 검색</strong></label><div style="height:9px"></div><input id="search" placeholder="날짜, Sn, Pd, 폐수, 자동화 검색" aria-label="과거 동향 검색"><div class="chips" id="categories"></div><div id="status" class="muted"></div></div><div class="panel"><h2 class="heading">날짜별 주요 뉴스 5건</h2><p class="muted">왼쪽은 날짜, 오른쪽은 해당 날짜의 뉴스 제목입니다. 제목을 누르면 자세한 내용이 펼쳐집니다.</p></div><div id="days" class="archive-list"></div><div id="archiveArticles"></div></section></main><footer>JM R&D · 날짜별 산업기술 뉴스 아카이브<br>기사 원문을 확인하여 주요 사실을 검증해 주세요. 자동 게시 시간은 운영 환경에 따라 지연될 수 있습니다.</footer><script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.6/kakao.min.js"></script><script>
const categories=['전체','도금기술','전자부품','친환경·회수','자동화·검사','산업동향'];let active='전체',articles=[],tab='today',selectedDate=null,selectedArticle=null;const $=s=>document.querySelector(s);function safe(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function localDate(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const v=k=>p.find(x=>x.type===k).value;return `${v('year')}-${v('month')}-${v('day')}`}function articleHTML(x){return `<article class="article"><div class="muted">${safe(x.date)} · ${safe(x.region)} · ${safe(x.category)}${x.published?` · 기사 ${safe(x.published)}`:""}</div><h2>${safe(x.title)}</h2><p>${safe(x.summary)}</p><div>${(x.keywords||[]).map(t=>`<span class="tag">#${safe(t)}</span>`).join('')}</div><details><summary>기술 배경과 현장 적용 보기</summary><p><strong>기술 배경</strong><br>${safe(x.background)}</p><p><strong>현장 적용 관점</strong><br>${safe(x.impact)}</p>${/^https:\/\//.test(x.source||'')?`<p><a href="${safe(x.source)}" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a></p>`:''}</details></article>`}function render(){const today=localDate();const now=articles.filter(x=>x.date===today);$('#todayHeading').textContent=`오늘의 동향 · ${today}`;$('#todayStatus').textContent=now.length?`오늘 등록된 ${now.length}건의 뉴스입니다.`:`오늘(${today}) 등록된 뉴스가 없습니다. 자동 게시 준비 중이거나 수집·검증이 지연될 수 있습니다. 과거 동향을 확인해 주세요.`;$('#todayArticles').innerHTML=now.length?now.map(articleHTML).join(''):'<div class="panel">아직 오늘의 뉴스가 등록되지 않았습니다. <button id="goArchive" class="day" type="button">과거 동향 확인하기 →</button></div>';if($('#goArchive'))$('#goArchive').onclick=()=>switchTab('archive');let q=$('#search').value.toLowerCase().trim();let past=articles.filter(x=>x.date<today&&(active==='전체'||x.category===active)&&JSON.stringify(x).toLowerCase().includes(q));let dates=[...new Set(past.map(x=>x.date))].sort().reverse();if(!dates.includes(selectedDate))selectedDate=dates[0]||null;$('#status').textContent=`과거 ${dates.length}일 · ${past.length}건`;$('#categories').innerHTML=categories.map(c=>`<button type="button" data-category="${safe(c)}" class="${c===active?'active':''}">${safe(c)}</button>`).join('');document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{active=b.dataset.category;selectedArticle=null;render()});$('#days').innerHTML=dates.length?dates.map(d=>{let a=past.filter(x=>x.date===d).slice(0,5);let weekday=['일','월','화','수','목','금','토'][new Date(d+'T12:00:00').getDay()];return `<section class="archive-row"><div class="archive-date">${safe(d)}<small>${weekday}요일 · ${a.length}건</small></div><ol class="archive-titles">${a.map((x,i)=>`<li><button type="button" data-article="${safe(d)}:${i}" aria-expanded="${selectedArticle===d+':'+i}">${safe(x.title)}</button></li>`).join('')}</ol>${selectedArticle?.startsWith(d+':')?`<div class="archive-expanded">${articleHTML(a[Number(selectedArticle.split(':')[1])])}</div>`:''}</section>`}).join(''):'<div class="panel">검색 결과가 없습니다. 뉴스가 누적되면 날짜별로 표시됩니다.</div>';document.querySelectorAll('[data-article]').forEach(b=>b.onclick=()=>{selectedArticle=selectedArticle===b.dataset.article?null:b.dataset.article;render()});$('#archiveArticles').innerHTML='';}function switchTab(t){tab=t;$('#todayView').hidden=t!=='today';$('#archiveView').hidden=t!=='archive';$('#todayTab').classList.toggle('active',t==='today');$('#archiveTab').classList.toggle('active',t==='archive');window.scrollTo(0,0)}const KAKAO_JS_KEY='fea7596816d7e32591a06e19b0da6afb';
$('#shareNews').onclick=async()=>{const msg=$('#shareFeedback');msg.textContent='';const today=localDate();const list=articles.filter(x=>x.date===today).slice(0,5);const url='https://ds3hzt.github.io/JM-RND-NEWS/';const summary=list.length?list.map((x,i)=>(i+1)+'. '+x.title).join('\\n'):'최신 뉴스를 웹사이트에서 확인해 주세요.';const shareText='JM R&D 최신 동향 · '+today+'\\n'+summary;try{if(!window.Kakao||!Kakao.Share)throw Error('카카오 SDK 로딩 실패');if(!Kakao.isInitialized())Kakao.init(KAKAO_JS_KEY);Kakao.Share.sendDefault({objectType:'text',text:shareText,link:{mobileWebUrl:url,webUrl:url},buttonTitle:'뉴스 확인하기'});msg.textContent='카카오톡에서 대화방을 선택해 전송해 주세요.';return}catch(e){msg.textContent='카카오톡 직접 연결에 실패했습니다. 휴대전화 공유 메뉴로 연결합니다.'}try{if(navigator.share){await navigator.share({title:'JM R&D 최신 동향',text:shareText,url});msg.textContent='공유 메뉴에서 카카오톡을 선택해 주세요.';return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(shareText+'\\n'+url);msg.textContent='공유 기능이 제한되어 뉴스 내용을 복사했습니다. 카카오톡에 붙여넣어 주세요.'}catch(e){msg.textContent='기본 브라우저(크롬 또는 삼성 인터넷)에서 열어 다시 시도해 주세요.'}};$('#todayTab').onclick=()=>switchTab('today');$('#archiveTab').onclick=()=>switchTab('archive');$('#search').oninput=()=>{selectedArticle=null;render()};fetch('./news.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('뉴스 데이터를 읽을 수 없습니다');return r.json()}).then(data=>{articles=Array.isArray(data)?data:[];render()}).catch(()=>{$('#todayStatus').textContent='뉴스를 불러오지 못했습니다. 웹 서버로 실행해 주세요.';$('#status').textContent='데이터 로딩 실패'});render();</script></body></html>
